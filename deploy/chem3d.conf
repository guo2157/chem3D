server {
    listen 5173;
    server_name _;

    root /home/ubuntu/chem3D/dist;
    index index.html;

    access_log /var/log/nginx/chem3d.access.log;
    error_log  /var/log/nginx/chem3d.error.log;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
