<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FCC 面心立方晶格 - chem3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0f1a;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .viewer {
      position: relative;
      width: min(1400px, calc(100vw - 24px));
      height: min(900px, calc(100vh - 24px));
      border-radius: 14px;
      overflow: hidden;
      background: #0f172a;
      box-shadow: 0 0 30px rgba(56,189,248,0.06);
      border: 1px solid rgba(71,85,105,0.25);
    }
    #app { width: 100%; height: 100%; display: block; }
    canvas { display: block; }

    /* ---- 顶部控制栏 ---- */
    .top-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 16px;
      background: linear-gradient(180deg, rgba(15,23,42,0.9) 60%, transparent);
      pointer-events: none;
    }
    .top-bar > * { pointer-events: auto; }
    .top-bar .label {
      color: #64748b; font-size: 11px; letter-spacing: 0.05em; margin-right: 4px;
    }
    .top-bar button {
      padding: 5px 14px;
      background: rgba(30,41,59,0.85);
      color: #cbd5e1;
      border: 1px solid rgba(71,85,105,0.4);
      border-radius: 6px;
      font-size: 12px; font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }
    .top-bar button:hover {
      background: rgba(51,65,85,0.9);
      color: #e2e8f0;
      border-color: rgba(56,189,248,0.5);
    }
    .top-bar button.active {
      background: rgba(56,189,248,0.2);
      color: #38bdf8;
      border-color: #38bdf8;
    }

    /* ---- 底部图例 ---- */
    .bottom-legend {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: flex; align-items: center; gap: 18px;
      padding: 6px 16px;
      background: rgba(15,23,42,0.8);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(71,85,105,0.25);
      color: #94a3b8; font-size: 12px;
    }
    .bottom-legend .item { display: flex; align-items: center; gap: 6px; }
    .bottom-legend .dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .bottom-legend .dot.corner { background: #f97316; }
    .bottom-legend .dot.face { background: #38bdf8; }
    .bottom-legend .dot.bond { background: transparent; border-bottom: 1.5px solid #64748b; width: 14px; height: 0; border-radius: 0; }
  </style>
</head>
<body>
  <div class="viewer">
    <div id="app"></div>

    <!-- 顶部投影按钮 -->
    <div class="top-bar">
      <span class="label">投影</span>
      <button data-proj="100">[100] 正视</button>
      <button data-proj="010">[010] 侧视</button>
      <button data-proj="001">[001] 俯视</button>
      <button data-proj="110">[110] 面对角线</button>
      <button data-proj="111">[111] 体对角线</button>
    </div>

    <!-- 底部图例 -->
    <div class="bottom-legend">
      <div class="item"><span class="dot corner"></span> 顶点 (8×)</div>
      <div class="item"><span class="dot face"></span> 面心 (6×)</div>
      <div class="item"><span class="dot bond"></span> 最近邻键</div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.181.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.181.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.querySelector('#app');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(7, 5.5, 9);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xdbeafe, 0x1e293b, 1.2));
    scene.add(new THREE.DirectionalLight(0xffffff, 0.6).translateY(4).translateX(2));

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);
    controls.update();

    // ---- 5×5×5 超胞，渲染核心 3×3×3 ----
    const basis = [[0,0,0], [0.5,0.5,0], [0.5,0,0.5], [0,0.5,0.5]];
    const a = 2;
    const nCore = 3;
    const nOuter = nCore + 2;
    const allAtoms = [];

    for (let i = 0; i < nOuter; i++) {
      for (let j = 0; j < nOuter; j++) {
        for (let k = 0; k < nOuter; k++) {
          const isCore = i >= 1 && i <= nCore && j >= 1 && j <= nCore && k >= 1 && k <= nCore;
          basis.forEach(([fx, fy, fz], bi) => {
            allAtoms.push({
              pos: new THREE.Vector3((i + fx) * a - nOuter, (j + fy) * a - nOuter, (k + fz) * a - nOuter),
              type: bi === 0 ? 0 : 1,
              visible: isCore
            });
          });
        }
      }
    }

    const cornerPts = [];
    const facePts = [];
    allAtoms.forEach(a => {
      if (!a.visible) return;
      if (a.type === 0) cornerPts.push(a.pos);
      else facePts.push(a.pos);
    });

    const cornerGeo = new THREE.SphereGeometry(0.4, 32, 20);
    const cornerMat = new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.25, metalness: 0.15 });
    const cornerAtoms = new THREE.InstancedMesh(cornerGeo, cornerMat, cornerPts.length);
    const mc = new THREE.Matrix4();
    cornerPts.forEach((p, i) => cornerAtoms.setMatrixAt(i, mc.makeTranslation(p.x, p.y, p.z)));

    const faceGeo = new THREE.SphereGeometry(0.28, 32, 20);
    const faceMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.25, metalness: 0.15 });
    const faceAtoms = new THREE.InstancedMesh(faceGeo, faceMat, facePts.length);
    const mf = new THREE.Matrix4();
    facePts.forEach((p, i) => faceAtoms.setMatrixAt(i, mf.makeTranslation(p.x, p.y, p.z)));

    const bondThreshold = 1.5;
    const bondVerts = [];
    for (let i = 0; i < allAtoms.length; i++) {
      for (let j = i + 1; j < allAtoms.length; j++) {
        if (allAtoms[i].pos.distanceTo(allAtoms[j].pos) < bondThreshold) {
          if (allAtoms[i].visible && allAtoms[j].visible) {
            bondVerts.push(allAtoms[i].pos.x, allAtoms[i].pos.y, allAtoms[i].pos.z);
            bondVerts.push(allAtoms[j].pos.x, allAtoms[j].pos.y, allAtoms[j].pos.z);
          }
        }
      }
    }
    const bondGeo = new THREE.BufferGeometry();
    bondGeo.setAttribute('position', new THREE.Float32BufferAttribute(bondVerts, 3));
    const bondLines = new THREE.LineSegments(
      bondGeo,
      new THREE.LineBasicMaterial({ color: 0x64748b, transparent: true, opacity: 0.55 })
    );

    // 根据可见顶点原子计算包围盒，使边框连接在最外层球体上
    let bmin = new THREE.Vector3(Infinity, Infinity, Infinity);
    let bmax = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
    cornerPts.forEach(p => { bmin.min(p); bmax.max(p); });
    const boxCenter = new THREE.Vector3().addVectors(bmin, bmax).multiplyScalar(0.5);
    const boxSize = new THREE.Vector3().subVectors(bmax, bmin);
    const boxGeo = new THREE.BoxGeometry(boxSize.x, boxSize.y, boxSize.z);
    const boxEdge = new THREE.EdgesGeometry(boxGeo);
    const boxLine = new THREE.LineSegments(boxEdge, new THREE.LineBasicMaterial({ color: 0x475569, transparent: true, opacity: 0.35 }));
    boxLine.position.copy(boxCenter);

    const atomGroup = new THREE.Group();
    atomGroup.add(cornerAtoms);
    atomGroup.add(faceAtoms);
    atomGroup.add(bondLines);
    scene.add(atomGroup);
    scene.add(boxLine);

    // ---- 投影方向 ----
    const D = 10;
    const projections = {
      '100': new THREE.Vector3(D, 0, 0),
      '010': new THREE.Vector3(0, D, 0),
      '001': new THREE.Vector3(0, 0, D),
      '110': new THREE.Vector3(D / Math.SQRT2, D / Math.SQRT2, 0),
      '111': new THREE.Vector3(D / Math.sqrt(3), D / Math.sqrt(3), D / Math.sqrt(3)),
    };

    let animFrom = null, animTarget = null, animStart = 0;
    const animDuration = 600;
    let animActive = false;

    function setActiveButton(proj) {
      document.querySelectorAll('.top-bar button').forEach(b => b.classList.remove('active'));
      const btn = document.querySelector(`[data-proj="${proj}"]`);
      if (btn) btn.classList.add('active');
    }

    function animateCameraTo(targetPos) {
      animFrom = camera.position.clone();
      animTarget = targetPos.clone();
      animStart = performance.now();
      animActive = true;
      controls.target.set(0, 0, 0);
    }

    document.querySelectorAll('.top-bar button').forEach(btn => {
      btn.addEventListener('click', () => {
        const proj = btn.dataset.proj;
        const pos = projections[proj];
        if (!pos) return;
        setActiveButton(proj);
        animateCameraTo(pos);
      });
    });

    window.addEventListener('keydown', (e) => {
      const keys = { '1': '100', '2': '010', '3': '001', '4': '110', '5': '111' };
      const proj = keys[e.key];
      if (!proj) return;
      const target = document.activeElement;
      if (target && (target.isContentEditable || ['INPUT','TEXTAREA','SELECT'].includes(target.tagName))) return;
      setActiveButton(proj);
      animateCameraTo(projections[proj]);
    });

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function animate(time) {
      requestAnimationFrame(animate);

      if (animActive) {
        const elapsed = time - animStart;
        const t = Math.min(elapsed / animDuration, 1);
        camera.position.lerpVectors(animFrom, animTarget, easeInOutCubic(t));
        camera.lookAt(0, 0, 0);
        if (t >= 1) animActive = false;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate(performance.now());

    const viewer = document.querySelector('.viewer');
    const ro = new ResizeObserver(() => {
      const w = viewer.clientWidth;
      const h = viewer.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });
    ro.observe(viewer);
  </script>
</body>
</html>
